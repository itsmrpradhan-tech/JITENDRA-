name: JITENDRA APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'JITENDRA_Demo_Android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p JITENDRA_Demo_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JITENDRA-Demo-APK
          path: JITENDRA_Demo_Android/app/build/outputs/apk/debug/*.apk
